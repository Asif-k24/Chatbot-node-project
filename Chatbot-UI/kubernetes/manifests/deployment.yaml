apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-ui
  namespace: chatbot-app
  labels:
    app: chatbot-ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chatbot-ui
  template:
    metadata:
      labels:
        app: chatbot-ui
      annotations:
        prometheus.io/scrape: "true"           # Enable scraping
        prometheus.io/port: "3000"             # Port to scrape
        prometheus.io/path: "/metrics"         # Metrics endpoint
    spec:
      containers:
      - name: chatbot-ui
        image: asif0098/chatbot-ui:latest  # Will be updated by Jenkins
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
